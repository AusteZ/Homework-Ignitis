spring.application.name=Homework-Ignitis

spring.datasource.url=jdbc:h2:mem:chatdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Liquibase
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

# H2 browser console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false

app.security.jwt.secret=test-test-test-test-test-test-secret
app.security.jwt.expires-in=PT1H

app.security.bootstrap-admin.username=test-admin
app.security.bootstrap-admin.password=test-admin-password
