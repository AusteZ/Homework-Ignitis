plugins {
    id 'org.springframework.boot' version '4.1.1' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'org.jooq.jooq-codegen-gradle' version '3.21.7' apply false
}

allprojects {
    group = 'com.az'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}
