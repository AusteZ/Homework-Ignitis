plugins {
    id 'groovy'
    id 'io.spring.dependency-management'
}

description = 'Automated API tests for a deployed chatroom service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    testImplementation 'org.apache.groovy:groovy:4.0.27'
    testImplementation 'com.google.code.gson:gson:2.13.2'
    testImplementation 'io.rest-assured:rest-assured:5.5.6'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.1'
    testImplementation 'org.springframework.boot:spring-boot-starter-test:4.1.1'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation:4.1.1'
    testImplementation 'org.spockframework:spock-core:2.4-M6-groovy-4.0'
    testImplementation 'org.spockframework:spock-spring:2.4-M6-groovy-4.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations.configureEach {
    resolutionStrategy.force 'org.apache.groovy:groovy:4.0.27'
}

tasks.named('test') {
    description = 'Runs Spock automated API tests against a deployed chatroom service.'
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}
